version: '3.9'

services:
  mysql:
    image: mysql:8.3
    container_name: mysql-jwt-app
    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jwt_app
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

volumes:
  mysql_data: