server {
  listen 80;
  server_name _;

  # SPA (Angular)
  root /usr/share/nginx/html;
  index index.html;

  # Auth endpoints (evita colisión con rutas SPA /register)
  location = /api/authenticate {
    proxy_pass http://backend:8080/authenticate;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /api/register {
    proxy_pass http://backend:8080/register;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # API REST versionada
  location /api/v1/ {
    proxy_pass http://backend:8080/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Swagger/OpenAPI
  location = /api/swagger-ui-rest.html {
    proxy_pass http://backend:8080/swagger-ui-rest.html;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /api/v3/api-docs {
    proxy_pass http://backend:8080/v3/api-docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Fallback SPA
  location / {
    try_files $uri $uri/ /index.html;
  }
}
