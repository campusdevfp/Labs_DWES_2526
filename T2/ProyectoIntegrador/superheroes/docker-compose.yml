version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: superheroes-mysql
    restart: always
    environment:
      MYSQL_DATABASE: springDevDb
      MYSQL_USER: mysql
      MYSQL_PASSWORD: pass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mysql", "-ppass"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
