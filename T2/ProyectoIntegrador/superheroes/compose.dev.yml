services:
  mysql:
    image: mysql:8.0
    container_name: superheroes-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-springDevDb}
      MYSQL_USER: ${MYSQL_USER:-mysql}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-mysql}", "-p${MYSQL_PASSWORD:-pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password

  backend:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: superheroes-backend-dev
    working_dir: /workspace
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-springDevDb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-mysql}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-pass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      client.url: http://localhost:${FRONTEND_DEV_PORT:-4200}
      jwt.secret: ${JWT_SECRET:-8fhgeigayuf64oq8ltw36pi84wl87trf8afpw7ty934t7fwaeGTFyugfldlsjfdglja}
    volumes:
      - ./:/workspace
      - m2_cache:/root/.m2
    command: mvn -B -ntp spring-boot:run
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    image: node:20-alpine
    container_name: superheroes-frontend-dev
    working_dir: /app
    depends_on:
      - backend
    environment:
      # Si usas environment.ts con localhost:8080, no hace falta proxy aquí.
      # Alternativa: configurar un proxy.conf en Angular.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - node_modules_cache:/app/node_modules
    command: sh -c "npm ci && npm run start -- --host 0.0.0.0 --port 4200"
    ports:
      - "${FRONTEND_DEV_PORT:-4200}:4200"

volumes:
  mysql_data_dev:
  m2_cache:
  node_modules_cache:
